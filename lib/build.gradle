plugins {
    id 'java-library'
    // id("com.gradleup.shadow") version "9.6.1"
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    // TODO: discuss logigng item 
    // implementation platform('org.apache.logging.log4j:log4j-bom:2.26.1')

    // // This dependency is used by the application.
    // implementation 'org.apache.logging.log4j:log4j-api:${log4j-api.version}'

    // runtimeOnly 'org.apache.logging.log4j:log4j-core:2.26.1'
    // runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl' 
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// application {
    // Define the main class for the application.
    // mainClass = ''
// }

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
